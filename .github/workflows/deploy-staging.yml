name: Deploy staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: staging-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy frontend to staging
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /var/www/egi-media/cms/frontend
            # Discard stray VPS source edits so pull can proceed (.env* kept).
            git diff --name-only -- . ':!node_modules' ':!.next' ':!.env' ':!.env.*' \
              | while IFS= read -r file; do
                  [ -n "$file" ] || continue
                  git checkout -- "$file"
                done
            FORCE_DEPLOY=1 bash scripts/deploy-staging.sh
